<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ну, погоди!</title>
    <link data-trunk rel="rust" data-bin="nupogodi" />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1b1b; }
      body { display: flex; align-items: center; justify-content: center; }
      #nupogodi {
        outline: none;
        width: min(100vw, calc(100vh * 1120 / 672)) !important;
        height: min(100vh, calc(100vw * 672 / 1120)) !important;
        touch-action: none;
      }
      /* Portrait phones get a device a quarter of the screen tall; ask for landscape. */
      .rotate { display: none; }
      @media (orientation: portrait) and (max-width: 700px) {
        .rotate {
          display: block;
          position: fixed;
          top: max(16px, calc(50% - 100vw * 672 / 1120 / 2 - 72px));
          left: 16px;
          right: 16px;
          margin: 0;
          color: #c9c9c3;
          font: 600 16px/1.4 system-ui, sans-serif;
          text-align: center;
        }
        .rotate span { display: block; font-size: 32px; line-height: 1.2; }
      }
    </style>
  </head>
  <body>
    <canvas id="nupogodi" tabindex="0"></canvas>
    <p class="rotate" aria-hidden="true"><span>⟳</span>Turn your phone sideways for bigger buttons</p>
  </body>
</html>
